name: Dependency vulnerabilities (osv-scanner)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # semanal — las dependencias no cambian cada push, pero los CVE nuevos si
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
    with:
      scan-args: |-
        --recursive
        --skip-git
        ./
