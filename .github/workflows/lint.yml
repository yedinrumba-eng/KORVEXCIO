name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # la config real (line-length 110, reglas, ignores) vive en pyproject.toml
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./korvexcio"
